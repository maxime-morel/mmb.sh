baseURL = 'https://mmb.sh/'
languageCode = 'fr-fr'
defaultContentLanguage = 'fr'
defaultContentLanguageInSubdir = false
title = 'Bric-à-brac - Maxime Morel-Bailly'
theme = 'PaperMod'
enableGitInfo = true
enableRobotsTXT = true

[services]
  [services.googleAnalytics]
    id = 'G-F97LXLKTJC'

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  category = 'categories'
  keyword = 'keywords'

[params]
  author = 'Maxime Morel-Bailly'
  keywords = ['cybersécurité', 'linux', 'infrastructure', 'cloud', 'privacy', 'hugo']
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  images = ['/images/site/og-default.png']

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/maxime-morel'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/maximemorelbailly'

[languages.fr]
  languageCode = 'fr-FR'
  languageName = 'Français'
  title = 'Le Lab, par Maxime'
  weight = 1

  [languages.fr.params]
    description = 'Articles techniques sur la cybersécurité, Linux, l’infrastructure et des retours d’expérience concrets.'

    [languages.fr.params.homeInfoParams]
      Title = 'Le Lab'
      Content = 'Cybersécurité, Linux, infrastructure, cloud et retours d’expérience concrets.'

  [[languages.fr.menu.main]]
    identifier = 'posts'
    name = 'Articles'
    url = '/posts/'
    weight = 10

  [[languages.fr.menu.main]]
    identifier = 'about'
    name = 'À propos'
    url = '/about/'
    weight = 20

[languages.en]
  languageCode = 'en-US'
  languageName = 'English'
  title = 'The Lab, by Maxime'
  weight = 2

  [languages.en.params]
    description = 'Technical articles about cybersecurity, Linux, infrastructure, and practical field notes.'

    [languages.en.params.homeInfoParams]
      Title = 'The Lab'
      Content = 'Cybersecurity, Linux, infrastructure, cloud, and practical technical notes.'

  [[languages.en.menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/en/posts/'
    weight = 10

  [[languages.en.menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/en/about/'
    weight = 20
